# /etc/nginx/sites-available/flyash.musaraf.org.in
# One domain: /api/v1 → Adonis on 127.0.0.1:3334, everything else → Flutter web.
# certbot --nginx adds the HTTPS (443) part to this file.
server {
    listen 80;
    listen [::]:80;
    server_name flyash.musaraf.org.in;

    root /var/www/workspace/FlyAsh/app/build/web;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The Flutter entry files must never be cached, or users keep an old app.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-cache"; }

    # Clean URLs (/sales/12) are app routes: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
