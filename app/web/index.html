<!DOCTYPE html>
<html>
<head>
  <!--
    The base path the app is served from (replaced by `flutter build --base-href`).
    It must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FlyAsh brick factory management">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FlyAsh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FlyAsh</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen shown while Flutter downloads and starts (otherwise the page
    is blank). Colors follow the app theme: the saved mode, else the system.
  -->
  <style>
    :root { --bg: #F5F7FB; --fg: #0F172A; --muted: #475569; --track: #E3E8F0; --accent: #1A56F0; }
    html.dark { --bg: #0B1120; --fg: #E2E8F0; --muted: #94A3B8; --track: #26314A; --accent: #7AA2FF; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 250ms ease-out; z-index: 9999;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading img { width: 112px; height: 112px; }
    #loading .name { font-size: 24px; font-weight: 700; letter-spacing: 0.2px; }
    #loading .tag { font-size: 14px; color: var(--muted); margin-top: -10px; }
    #loading .spinner {
      width: 28px; height: 28px; margin-top: 8px; border-radius: 50%;
      border: 3px solid var(--track); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .spinner { animation-duration: 2.5s; } }
  </style>
  <script>
    // Theme for the loading screen, read from the app's saved settings
    // (shared_preferences stores "flutter.theme.mode" as a JSON string).
    (function () {
      var mode = 'system';
      try { mode = JSON.parse(localStorage.getItem('flutter.theme.mode') || '"system"'); } catch (e) {}
      var dark = mode === 'dark' ||
        (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <div id="loading" role="progressbar" aria-label="Loading FlyAsh">
    <img src="splash/logo.png" alt="FlyAsh logo">
    <div class="name">FlyAsh</div>
    <div class="tag">Brick factory management</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Hide the loading screen as soon as Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
